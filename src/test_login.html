<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login Backend Test</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 3rem auto; padding: 1rem; }
    input { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    button { padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; margin-top: 1.5rem; border-radius: 4px; white-space: pre-wrap; }
    .success { color: green; }
    .failure { color: red; }
  </style>
</head>
<body>
  <h2>Login Backend Test</h2>
  <p>This page tests <code>login.php</code> directly — no React needed.</p>

  <form id="form">
    <label>Username</label>
    <input type="text" name="username" placeholder="e.g. testuser" required />
    <label>Password</label>
    <input type="password" name="password" placeholder="e.g. password123" required />
    <button type="submit">Send POST to login.php</button>
  </form>

  <pre id="output">Response will appear here...</pre>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const output = document.getElementById('output');
      const { username, password } = Object.fromEntries(new FormData(e.target));

      output.className = '';
      output.textContent = 'Sending request...';

      try {
        const res = await fetch('login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        output.className = data.success ? 'success' : 'failure';
        output.textContent = 'HTTP ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
      } catch (err) {
        output.className = 'failure';
        output.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
